# Blueprint de Render: crea el servicio web desde el Dockerfile.
# Las variables con sync: false se cargan a mano en el dashboard (no van al repo).
services:
  - type: web
    name: api-transaccional
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: CORS_ORIGIN
        value: "*"
      # Opcional: si se define, la API exige el header X-API-Key.
      - key: API_KEY
        sync: false
